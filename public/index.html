<title>DysLearn — Login</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="topbar">
  <span class="brand"><span class="brand-icon">🎓</span> Dyslearn</span>
</div>

<div class="page narrow">
  <h1>📚 Welcome to DysLearn</h1>
  <p class="page-intro">An AI-based tutor for lower primary pupils with learning difficulties.</p>

  <div class="card">
    <div class="role-toggle">
      <button type="button" id="role-student" class="active">I'm a Pupil</button>
      <button type="button" id="role-teacher">I'm a Teacher</button>
      <button type="button" id="role-parent">I'm a Parent</button>
    </div>

    <form id="login-form">
      <label id="identifier-label" for="identifier">Username</label>
      <input id="identifier" name="identifier" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit" class="btn-block">Log In</button>
    </form>

    <div id="msg"></div>

    <p style="margin-top: 20px;">New here? <a href="/register.html">Create an account</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  let role = 'student';
  const buttons = {
    student: document.getElementById('role-student'),
    teacher: document.getElementById('role-teacher'),
    parent: document.getElementById('role-parent')
  };
  const idLabel = document.getElementById('identifier-label');
  const idInput = document.getElementById('identifier');

  function setRole(r) {
    role = r;
    for (const [key, btn] of Object.entries(buttons)) btn.classList.toggle('active', key === r);
    idLabel.textContent = r === 'student' ? 'Username' : 'Email';
    idInput.type = r === 'student' ? 'text' : 'email';
  }
  for (const [key, btn] of Object.entries(buttons)) btn.addEventListener('click', () => setRole(key));

  const dest = {
    student: '/student-dashboard.html',
    teacher: '/teacher-dashboard.html',
    parent: '/parent-dashboard.html'
  };

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('identifier').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.innerHTML = '';
    try {
      const data = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ role, identifier, password })
      });
      window.location.href = dest[data.role] || '/';
    } catch (err) {
      msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  });
</script>
