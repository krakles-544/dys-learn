<title>DysLearn — Register</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="page" style="max-width: 520px;">
  <h1>📚 Create your DysLearn account</h1>

  <div class="card">
    <div class="role-toggle">
      <button type="button" id="role-student" class="active">I'm a Pupil</button>
      <button type="button" id="role-teacher">I'm a Teacher</button>
    </div>

    <form id="student-form">
      <label for="s-regno">Registration No.</label>
      <input id="s-regno" required />
      <label for="s-firstname">First Name</label>
      <input id="s-firstname" required />
      <label for="s-lastname">Last Name</label>
      <input id="s-lastname" required />
      <label for="s-grade">Grade (1–3)</label>
      <input id="s-grade" type="number" min="1" max="3" required />
      <label for="s-username">Choose a Username</label>
      <input id="s-username" required />
      <label for="s-password">Choose a Password</label>
      <input id="s-password" type="password" required />
      <label for="s-parent">Parent/Guardian Phone</label>
      <input id="s-parent" />
      <button type="submit">Create Pupil Account</button>
    </form>

    <form id="teacher-form" style="display:none;">
      <label for="t-firstname">First Name</label>
      <input id="t-firstname" required />
      <label for="t-lastname">Last Name</label>
      <input id="t-lastname" required />
      <label for="t-email">Email</label>
      <input id="t-email" type="email" required />
      <label for="t-subject">Subject you teach</label>
      <input id="t-subject" />
      <label for="t-password">Choose a Password</label>
      <input id="t-password" type="password" required />
      <button type="submit">Create Teacher Account</button>
    </form>

    <div id="msg"></div>
    <p style="margin-top: 20px;">Already have an account? <a href="/">Log in</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  let role = 'student';
  const studentBtn = document.getElementById('role-student');
  const teacherBtn = document.getElementById('role-teacher');
  const studentForm = document.getElementById('student-form');
  const teacherForm = document.getElementById('teacher-form');

  function setRole(r) {
    role = r;
    studentBtn.classList.toggle('active', r === 'student');
    teacherBtn.classList.toggle('active', r === 'teacher');
    studentForm.style.display = r === 'student' ? 'block' : 'none';
    teacherForm.style.display = r === 'teacher' ? 'block' : 'none';
  }
  studentBtn.addEventListener('click', () => setRole('student'));
  teacherBtn.addEventListener('click', () => setRole('teacher'));

  const msg = document.getElementById('msg');

  studentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.innerHTML = '';
    try {
      await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          role: 'student',
          regno: document.getElementById('s-regno').value,
          firstname: document.getElementById('s-firstname').value,
          lastname: document.getElementById('s-lastname').value,
          grade: Number(document.getElementById('s-grade').value),
          username: document.getElementById('s-username').value,
          password: document.getElementById('s-password').value,
          parent_mobile: document.getElementById('s-parent').value
        })
      });
      window.location.href = '/student-dashboard.html';
    } catch (err) {
      msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  });

  teacherForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.innerHTML = '';
    try {
      await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          role: 'teacher',
          firstname: document.getElementById('t-firstname').value,
          lastname: document.getElementById('t-lastname').value,
          email: document.getElementById('t-email').value,
          subject: document.getElementById('t-subject').value,
          password: document.getElementById('t-password').value
        })
      });
      window.location.href = '/teacher-dashboard.html';
    } catch (err) {
      msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  });
</script>
