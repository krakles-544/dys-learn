<title>DysLearn — Register</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="topbar">
  <span class="brand"><span class="brand-icon">🎓</span> Dyslearn</span>
</div>

<div class="page narrow">
  <h1>📚 Create your DysLearn account</h1>
  <p class="page-intro">Choose your role and fill in a few details to get started.</p>

  <div class="card">
    <div class="role-toggle">
      <button type="button" id="role-student" class="active">I'm a Pupil</button>
      <button type="button" id="role-teacher">I'm a Teacher</button>
      <button type="button" id="role-parent">I'm a Parent</button>
    </div>

    <form id="student-form">
      <label for="s-regno">Registration No.</label>
      <input id="s-regno" required />
      <label for="s-firstname">First Name</label>
      <input id="s-firstname" required />
      <label for="s-lastname">Last Name</label>
      <input id="s-lastname" required />
      <label for="s-grade">Grade (1–3)</label>
      <input id="s-grade" type="number" min="1" max="3" required />
      <label for="s-username">Choose a Username</label>
      <input id="s-username" required />
      <label for="s-password">Choose a Password</label>
      <input id="s-password" type="password" required />
      <label for="s-parent">Parent/Guardian Phone</label>
      <input id="s-parent" />
      <button type="submit" class="btn-block">Create Pupil Account</button>
    </form>

    <form id="teacher-form" style="display:none;">
      <label for="t-firstname">First Name</label>
      <input id="t-firstname" required />
      <label for="t-lastname">Last Name</label>
      <input id="t-lastname" required />
      <label for="t-email">Email</label>
      <input id="t-email" type="email" required />
      <label for="t-subject">Subject you teach</label>
      <input id="t-subject" />
      <label for="t-password">Choose a Password</label>
      <input id="t-password" type="password" required />
      <button type="submit" class="btn-block">Create Teacher Account</button>
    </form>

    <form id="parent-form" style="display:none;">
      <label for="p-firstname">First Name</label>
      <input id="p-firstname" required />
      <label for="p-lastname">Last Name</label>
      <input id="p-lastname" required />
      <label for="p-email">Email</label>
      <input id="p-email" type="email" required />
      <label for="p-mobile">Phone</label>
      <input id="p-mobile" />
      <label for="p-child">Child's Registration No. <span class="muted">(optional — you can link children later)</span></label>
      <input id="p-child" placeholder="e.g. DL-2026-001" />
      <label for="p-password">Choose a Password</label>
      <input id="p-password" type="password" required />
      <button type="submit" class="btn-block">Create Parent Account</button>
    </form>

    <div id="msg"></div>
    <p style="margin-top: 20px;">Already have an account? <a href="/">Log in</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  let role = 'student';
  const buttons = {
    student: document.getElementById('role-student'),
    teacher: document.getElementById('role-teacher'),
    parent: document.getElementById('role-parent')
  };
  const forms = {
    student: document.getElementById('student-form'),
    teacher: document.getElementById('teacher-form'),
    parent: document.getElementById('parent-form')
  };

  function setRole(r) {
    role = r;
    for (const [key, btn] of Object.entries(buttons)) btn.classList.toggle('active', key === r);
    for (const [key, form] of Object.entries(forms)) form.style.display = key === r ? 'block' : 'none';
  }
  for (const [key, btn] of Object.entries(buttons)) btn.addEventListener('click', () => setRole(key));

  const msg = document.getElementById('msg');
  const val = (id) => document.getElementById(id).value;

  forms.student.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.innerHTML = '';
    try {
      await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          role: 'student',
          regno: val('s-regno'), firstname: val('s-firstname'), lastname: val('s-lastname'),
          grade: Number(val('s-grade')), username: val('s-username'), password: val('s-password'),
          parent_mobile: val('s-parent')
        })
      });
      window.location.href = '/student-dashboard.html';
    } catch (err) { msg.innerHTML = `<div class="error-msg">${err.message}</div>`; }
  });

  forms.teacher.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.innerHTML = '';
    try {
      await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          role: 'teacher',
          firstname: val('t-firstname'), lastname: val('t-lastname'), email: val('t-email'),
          subject: val('t-subject'), password: val('t-password')
        })
      });
      window.location.href = '/teacher-dashboard.html';
    } catch (err) { msg.innerHTML = `<div class="error-msg">${err.message}</div>`; }
  });

  forms.parent.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.innerHTML = '';
    try {
      const data = await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          role: 'parent',
          firstname: val('p-firstname'), lastname: val('p-lastname'), email: val('p-email'),
          mobile: val('p-mobile'), child_regno: val('p-child'), password: val('p-password')
        })
      });
      window.location.href = '/parent-dashboard.html';
    } catch (err) { msg.innerHTML = `<div class="error-msg">${err.message}</div>`; }
  });
</script>
