<title>DysLearn — Parent Portal</title>
<link rel="stylesheet" href="/css/style.css" />

<div id="topbar"></div>

<div class="page">
  <h1>My Children's Learning Progress</h1>
  <p class="page-intro">Track performance scores and view action guidelines suggested by teachers and AI.</p>

  <div id="children"></div>

  <div id="empty" class="card empty-state" style="display:none;">
    <div class="empty-icon">🧑‍🤝‍🧑</div>
    <h3>No Registered Children Linked</h3>
    <p>Ask the school administrator or teacher to link your parent account with your child's student profile ID, or add it below.</p>
  </div>

  <div class="card">
    <h2>Link a Child</h2>
    <form id="link-form" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
      <div style="flex:1 1 240px;">
        <label for="regno">Child's Registration No.</label>
        <input id="regno" placeholder="e.g. DL-2026-001" required />
      </div>
      <button type="submit">Link Child</button>
    </form>
    <div id="link-msg"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  (async function init() {
    const me = await requireAuth('parent');
    if (!me) return;
    renderTopbar({ portal: 'Parent Portal', name: me.name, greetingWord: 'Welcome' });
    await load();
  })();

  async function load() {
    const data = await api('/api/parent/dashboard');
    const wrap = document.getElementById('children');
    wrap.innerHTML = '';
    document.getElementById('empty').style.display = data.children.length === 0 ? 'block' : 'none';

    for (const child of data.children) {
      const subjectsList = child.subjects
        .map((s) => `<li>${escapeHtml(s.subject_name)} <span class="muted">— Level ${s.level ?? 1}/5</span></li>`).join('');

      const g = child.guideline;
      const insights = g
        ? `
          <div class="insight ai">
            <h4>🤖 Autogenerated AI Insight</h4>
            <p>${escapeHtml(g.ai_insight || 'No insight yet.')}</p>
          </div>
          ${g.teacher_note ? `
          <div class="insight teacher">
            <h4>💬 Teacher's Guidelines</h4>
            <p>${escapeHtml(g.teacher_note)}</p>
          </div>` : ''}
          <p class="muted"><small>Updated ${new Date(g.created_at).toLocaleDateString()}</small></p>`
        : `<p class="muted">Your child's teacher hasn't shared any guidelines yet.</p>`;

      const block = document.createElement('div');
      block.className = 'two-col';
      block.innerHTML = `
        <div class="card">
          <h2 style="color:var(--violet-dark);">${escapeHtml(child.firstname)} ${escapeHtml(child.lastname)}</h2>
          <p class="muted">Grade Level: <strong>Grade ${child.grade}</strong> · Reg. ${escapeHtml(child.regno)}</p>

          <div class="stat-row" style="margin:14px 0;">
            <div class="stat blue"><div class="stat-value">${child.attendance_days}</div><div class="stat-label">Days Attended</div></div>
            <div class="stat green"><div class="stat-value">${child.status.label}</div><div class="stat-label">Overall Progress</div></div>
            <div class="stat violet"><div class="stat-value">${child.averageScore ?? '—'}</div><div class="stat-label">Average Score</div></div>
          </div>

          <h3>Active Subjects</h3>
          <ul class="check-list">${subjectsList}</ul>
        </div>

        <div class="card">
          <h2>Learning Insights &amp; Recommendations</h2>
          ${insights}
        </div>
      `;
      wrap.appendChild(block);
    }
  }

  document.getElementById('link-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('link-msg');
    msg.innerHTML = '';
    try {
      await api('/api/parent/link', {
        method: 'POST',
        body: JSON.stringify({ regno: document.getElementById('regno').value })
      });
      msg.innerHTML = `<div class="success-msg">Child linked.</div>`;
      document.getElementById('link-form').reset();
      await load();
    } catch (err) { msg.innerHTML = `<div class="error-msg">${err.message}</div>`; }
  });
</script>
